<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:">
  <title>cat-break</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="tint"></div>

  <div id="activity" class="fade" hidden></div>

  <div id="cat-wrap" class="fade">
    <div id="bubble" hidden>
      <p id="bubble-text"></p>
      <div id="bubble-buttons"></div>
    </div>
    <canvas id="cat" width="32" height="32"></canvas>
  </div>

  <div id="skip-hint" class="fade">
    Hold <kbd>Esc</kbd> to skip
    <div id="skip-bar"></div>
  </div>

  <script src="theme.js"></script>
  <script src="sprites.js"></script>
  <script src="overlay.js"></script>
</body>
</html>
